# Render Blueprint — spec: https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub/GitLab, then in Render pick
# New → Blueprint and select it. Render creates the database and the API
# service together and wires DATABASE_URL between them.
#
# The one value you must supply yourself is BACKEND_CORS_ORIGINS (marked
# `sync: false`); Render prompts for it during the first deploy.

databases:
  - name: web-app-template-db
    databaseName: app
    user: app
    plan: free # free databases are deleted after 30 days — use `basic-256mb`+ for real use
    postgresMajorVersion: "17" # matches Backend/docker-compose.yml

services:
  - type: web
    name: web-app-template-api
    runtime: python
    plan: free # free instances sleep after 15 min idle and cold-start in ~30s
    rootDir: Backend
    # Dependencies come from Backend/pyproject.toml — the same list Hatch
    # builds local environments from.
    buildCommand: pip install .
    # Migrations run before the server binds a port. On paid plans, move
    # `alembic upgrade head` to `preDeployCommand` so it runs once per deploy
    # rather than once per instance.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: web-app-template-db
          property: connectionString
      # Render generates a random secret; app/core/session.py hashes whatever
      # it is into a Fernet key. Never commit a real value here.
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # The frontend is served from a different origin than the API, so the
      # session cookie has to be cross-site — which browsers only allow over
      # HTTPS. Render terminates TLS for you.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      # Frontend origin(s) allowed to call the API. A single origin, a
      # comma-separated list, or a JSON array all work. Must be exact origins —
      # CORS with credentials forbids "*".
      - key: BACKEND_CORS_ORIGINS
        sync: false # e.g. https://your-frontend.onrender.com

# Deploying the frontend too? Add a static site alongside the API. Vite inlines
# VITE_API_URL at build time, so it has to be the API's full public URL — set it
# by hand once the API service exists, then add that site's own URL to
# BACKEND_CORS_ORIGINS above.
#
#   - type: web
#     name: web-app-template-web
#     runtime: static
#     rootDir: Frontend
#     buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
#     staticPublishPath: dist
